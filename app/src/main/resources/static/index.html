<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | My project</title>
    <link rel="shortcut icon" href="/unityWebGL/TemplateData/favicon.ico">
    <link rel="stylesheet" href="/unityWebGL/TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">My project</div>
      </div>
    </div>
    <button id="connectBtn">Connect to WebSocket</button> <!-- 버튼 추가 -->

    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        console.error(msg);
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "/unityWebGL/Build";
      var loaderUrl = buildUrl + "/build.loader.js";
      var config = {
        dataUrl: buildUrl + "/build.data.gz",
        frameworkUrl: buildUrl + "/build.framework.js.gz",
        codeUrl: buildUrl + "/build.wasm.gz",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "smpl_visualize",
        productVersion: "0.1",
        showBanner: unityShowBanner,
      };

      // if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      //   var meta = document.createElement('meta');
      //   meta.name = 'viewport';
      //   meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
      //   document.getElementsByTagName('head')[0].appendChild(meta);
      //   container.className = "unity-mobile";
      //   canvas.className = "unity-mobile";
      //   unityShowBanner('WebGL builds are not supported on mobile devices.');
      // } else {
      //   canvas.style.width = "960px";
      //   canvas.style.height = "600px";
      // }
      canvas.style.width = "960px";
      canvas.style.height = "600px";

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
          fullscreenButton.onclick = () => {
            unityInstance.SetFullscreen(1);
          };

          // // 버튼 클릭 시 데이터를 Flask 서버에서 가져와 Unity로 전송
          // function sendDataToUnity() {
          //   fetch("http://143.248.135.65:5552/get_animation_data")
          //     .then(response => response.json())
          //     .then(data => {
          //       // 데이터 전송: Unity의 'RecvMotion' 객체에 'ReceiveDataFromServer' 메서드로 데이터 전달
          //       unityInstance.SendMessage('RecvMotion', 'ReceiveDataFromServer', JSON.stringify(data));
          //     })
          //     .catch(error => console.error("Failed to fetch data:", error));
          // }

          // // 버튼에 이벤트 리스너 추가
          // document.getElementById("sendDataButton").onclick = sendDataToUnity;

          // WebSocket 연결 설정
          document.getElementById("connectBtn").addEventListener("click", () => {
              socket = new WebSocket("ws://localhost:5559/ws"); // Ktor 서버 WebSocket 주소

              socket.onopen = () => {
                  console.log("Connected to WebSocket server.");
              };

              socket.onmessage = (event) => {
                // console.log(`Received: ${event.data}`);
                unityInstance.SendMessage('RecvMotion', 'ReceiveDataFromServer', event.data);
              };

              socket.onerror = (error) => {
                  console.error(`Error: ${error.message}`);
              };

              socket.onclose = () => {
                console.log("WebSocket connection closed.");
              };
          });

        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
